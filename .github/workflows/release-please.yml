name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'warpdotdev/oz-sdk-typescript'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}

    steps:
      # Use the release app so release PRs remain app-owned.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: warpdotdev
          repositories: oz-sdk-typescript

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # release-please bumps `version` in package.json on its release branch but does
  # not regenerate pnpm-lock.yaml, so CI's frozen-lockfile bootstrap fails on that
  # branch with ERR_PNPM_OUTDATED_LOCKFILE. Refresh and push the lockfile back.
  refresh-lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    # Serialize pushes to the same release branch so a slower run can't
    # non-fast-forward push over a newer release-please update.
    concurrency:
      group: refresh-lockfile-${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
      cancel-in-progress: false
    steps:
      - name: Resolve release PR branch
        id: pr
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          BRANCH=$(echo "$PR_JSON" | jq -r '.headBranchName // empty')
          if [ -z "$BRANCH" ]; then
            echo "::error::could not resolve release-please PR head branch from outputs"
            echo "$PR_JSON" >&2
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: warpdotdev
          repositories: oz-sdk-typescript

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.30.1'

      - name: Refresh pnpm-lock.yaml
        run: pnpm install --lockfile-only

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already up to date."
            exit 0
          fi
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm-lock.yaml for release"
          git push origin "HEAD:${{ steps.pr.outputs.branch }}"
